<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('CampusFood - Registro')}"></head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h3 class="text-center mb-2 fw-bold">Crear una cuenta</h3>
                    <p class="text-center text-muted small mb-4">Únete a la comunidad de CampusFood. Solo para estudiantes verificados.</p>
                    
                    <form th:action="@{/registro}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="apellidos" class="form-label">Apellidos</label>
                                <input type="text" class="form-control" id="apellidos" name="apellidos" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Correo institucional</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="usuario@utp.edu.pe" required>
                            <div class="form-text small text-muted">Recibirás un enlace para verificar tu cuenta.</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password-confirm" class="form-label">Confirmar Contraseña</label>
                            <input type="password" class="form-control" id="password-confirm" name="password-confirm" required>
                        </div>
                        
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="terms" required>
                            <label class="form-check-label small" for="terms">Acepto los términos y condiciones de la plataforma.</label>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Registrarme</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">¿Ya tienes una cuenta? <a th:href="@{/login}" class="text-decoration-none fw-semibold">Inicia sesión</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>

</body>
</html>
