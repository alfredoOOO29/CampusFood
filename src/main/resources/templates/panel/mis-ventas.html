<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Gestión de Ventas - CampusFood')}"></head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container mt-5 mb-5">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0">Gestión de Ventas</h2>
        <a th:href="@{/panel}" class="btn btn-outline-secondary">Volver al Panel</a>
    </div>

    <!-- Mensaje de éxito o error -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">Código</th>
                        <th>Producto Solicitado</th>
                        <th>Comprador</th>
                        <th>Total a cobrar</th>
                        <th>Estado Actual</th>
                        <th class="pe-4 text-center">Tus Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${pedidos == null or pedidos.isEmpty()}">
                        <td colspan="6" class="text-center py-5 text-muted">Aún nadie te ha comprado nada.</td>
                    </tr>
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4 fw-bold text-secondary" th:text="'#' + ${pedido.id}">#1</td>
                        <td>
                            <div th:each="detalle : ${pedido.detalles}" class="d-flex flex-column">
                                <span class="fw-semibold text-dark" th:text="${detalle.producto.nombre}">Nombre Prod</span>
                                <small class="text-muted" th:text="'Cant: ' + ${detalle.cantidad}">Cant: 1</small>
                            </div>
                        </td>
                        <td th:text="${pedido.comprador.nombre + ' ' + pedido.comprador.apellidos}">Juan Comprador</td>
                        <td class="fw-bold text-success" th:text="'S/ ' + ${pedido.total}">S/ 0.00</td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${pedido.estado.name() == 'PENDIENTE' ? 'bg-warning text-dark' : 
                                                 (pedido.estado.name() == 'ACEPTADO' ? 'bg-info text-dark' : 
                                                 (pedido.estado.name() == 'LISTO' ? 'bg-primary' : 
                                                 (pedido.estado.name() == 'ENTREGADO' ? 'bg-success' : 'bg-danger')))}"
                                  th:text="${pedido.estado}">PENDIENTE</span>
                        </td>
                        <td class="pe-4 text-center">
                            <!-- Acciones Vendedor -->
                            <div class="d-flex justify-content-center gap-1">
                                <th:block th:if="${pedido.estado.name() == 'PENDIENTE'}">
                                    <form th:action="@{/panel/pedidos/{id}/estado(id=${pedido.id})}" method="post">
                                        <input type="hidden" name="estado" value="ACEPTADO">
                                        <input type="hidden" name="origen" value="ventas">
                                        <button type="submit" class="btn btn-sm btn-info text-white">Aceptar</button>
                                    </form>
                                    <form th:action="@{/panel/pedidos/{id}/estado(id=${pedido.id})}" method="post">
                                        <input type="hidden" name="estado" value="RECHAZADO">
                                        <input type="hidden" name="origen" value="ventas">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Seguro que deseas rechazar esta compra? El stock será devuelto.')">Rechazar</button>
                                    </form>
                                </th:block>
                                
                                <th:block th:if="${pedido.estado.name() == 'ACEPTADO'}">
                                    <form th:action="@{/panel/pedidos/{id}/estado(id=${pedido.id})}" method="post">
                                        <input type="hidden" name="estado" value="LISTO">
                                        <input type="hidden" name="origen" value="ventas">
                                        <button type="submit" class="btn btn-sm btn-primary">Marcar como Listo</button>
                                    </form>
                                </th:block>
                                
                                <span th:if="${pedido.estado.name() == 'LISTO'}" class="text-muted small">Esperando que el comprador confirme la entrega</span>
                                <span th:if="${pedido.estado.name() == 'ENTREGADO' or pedido.estado.name() == 'CANCELADO' or pedido.estado.name() == 'RECHAZADO'}" class="text-muted small">Finalizado</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>

</body>
</html>
