<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Publicar Producto - CampusFood')}"></head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-white border-0 pt-4 pb-0 px-4">
                    <h3 class="fw-bold mb-0">Publicar un alimento</h3>
                    <p class="text-muted small">Completa los detalles para que otros estudiantes puedan comprarte.</p>
                </div>
                <div class="card-body p-4">
                    
                    <div th:if="${errorProducto}" class="alert alert-danger" th:text="${errorProducto}"></div>
                    
                    <form th:action="@{/panel/productos/nuevo}" method="post" th:object="${productoDTO}">
                        
                        <h5 class="fw-semibold mb-3 text-primary">Información del Producto</h5>
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label for="nombre" class="form-label">Nombre del producto</label>
                                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Ej: Pan con pollo y papas" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="categoriaId" class="form-label">Categoría</label>
                                <select class="form-select" id="categoriaId" th:field="*{categoriaId}" required>
                                    <option value="" disabled selected>Selecciona...</option>
                                    <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></div>
                            </div>
                            
                            <div class="col-12">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="2" placeholder="Describe los ingredientes, tamaño, si es picante, etc." required></textarea>
                                <div class="text-danger small" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="precio" class="form-label">Precio (S/)</label>
                                <div class="input-group">
                                    <span class="input-group-text">S/</span>
                                    <input type="number" step="0.10" min="0" class="form-control" id="precio" th:field="*{precio}" required>
                                </div>
                                <div class="text-danger small" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="stock" class="form-label">Stock disponible</label>
                                <input type="number" min="1" class="form-control" id="stock" th:field="*{stock}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                            </div>
                        </div>

                        <hr class="my-4">
                        
                        <h5 class="fw-semibold mb-3 text-primary">Disponibilidad y Entrega</h5>
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="ubicacion" class="form-label">Ubicación exacta en el campus</label>
                                <input type="text" class="form-control" id="ubicacion" th:field="*{ubicacion}" placeholder="Ej: Mesas frente al Pabellón B" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('ubicacion')}" th:errors="*{ubicacion}"></div>
                            </div>
                            
                            <div class="col-md-4">
                                <label for="fechaDisponible" class="form-label">Fecha de venta</label>
                                <input type="date" class="form-control" id="fechaDisponible" th:field="*{fechaDisponible}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('fechaDisponible')}" th:errors="*{fechaDisponible}"></div>
                            </div>
                            
                            <div class="col-md-4">
                                <label for="horaInicio" class="form-label">Hora inicio</label>
                                <input type="time" class="form-control" id="horaInicio" th:field="*{horaInicio}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('horaInicio')}" th:errors="*{horaInicio}"></div>
                            </div>
                            
                            <div class="col-md-4">
                                <label for="horaFin" class="form-label">Hora fin</label>
                                <input type="time" class="form-control" id="horaFin" th:field="*{horaFin}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('horaFin')}" th:errors="*{horaFin}"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end mt-4">
                            <a th:href="@{/panel}" class="btn btn-outline-secondary me-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">Publicar Producto</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>

</body>
</html>
