<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('CampusFood - Iniciar Sesión')}"></head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h3 class="text-center mb-4 fw-bold">Bienvenido de nuevo</h3>
                    
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Correo institucional</label>
                            <input type="email" class="form-control" id="username" name="username" placeholder="usuario@utp.edu.pe" required autofocus>
                        </div>
                        
                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <label for="password" class="form-label">Contraseña</label>
                                <a href="#" class="text-decoration-none small text-primary">¿Olvidaste tu contraseña?</a>
                            </div>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                            <label class="form-check-label small" for="remember-me">Recordarme</label>
                        </div>
                        
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Ingresar</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">¿No tienes cuenta? <a th:href="@{/registro}" class="text-decoration-none fw-semibold">Regístrate aquí</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>

</body>
</html>
