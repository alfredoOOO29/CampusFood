<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('CampusFood - Verificar Código')}"></head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="cf-auth-container">
    <div class="cf-auth-card" style="max-width: 540px;">
        <div class="p-4 p-md-5 text-center">
            
            <!-- Icono Ilustrativo -->
            <div class="cf-feature-icon mx-auto mb-3" style="width: 68px; height: 68px; font-size: 1.8rem;">
                <i class="bi bi-shield-check text-cf-accent"></i>
            </div>

            <h3 class="fw-bold mb-2">Valida tu Correo</h3>
            <p class="text-muted small mb-4">
                Hemos enviado un código numérico de 6 dígitos a:<br>
                <strong class="text-dark" th:text="${email != null ? email : 'tu correo institucional'}">usuario@utp.edu.pe</strong>
            </p>

            <!-- Alertas -->
            <div th:if="${mensajeExito}" class="alert alert-success py-2 px-3 small rounded-4 mb-3" th:text="${mensajeExito}"></div>
            <div th:if="${errorVerificacion}" class="alert alert-danger py-2 px-3 small rounded-4 mb-3" th:text="${errorVerificacion}"></div>

            <!-- Formulario de Código -->
            <form th:action="@{/verificar-codigo}" method="post" class="mt-4">
                <input type="hidden" name="email" th:value="${email}">

                <div class="mb-4 text-start">
                    <label for="codigoInput" class="form-label text-center d-block fw-semibold text-secondary small">
                        Ingresa el código de 6 dígitos
                    </label>
                    <input type="text"
                           id="codigoInput"
                           name="codigo"
                           class="form-control text-center fw-bold rounded-4 py-3"
                           style="font-size: 2rem; letter-spacing: 12px; font-family: monospace; border: 2px solid var(--cf-border);"
                           maxlength="6"
                           pattern="[0-9]{6}"
                           inputmode="numeric"
                           placeholder="000000"
                           required
                           autofocus>
                    <div class="form-text text-center text-muted small mt-2">
                        ⏱️ El código tiene una validez de 15 minutos.
                    </div>
                </div>

                <button type="submit" class="btn btn-cf-primary w-100 py-3 fw-bold fs-6">
                    <span>Validar y Activar Cuenta</span>
                    <i class="bi bi-check-lg"></i>
                </button>
            </form>

            <!-- Reenviar Código -->
            <div class="mt-4 pt-3 border-top">
                <p class="small text-muted mb-2">¿No recibiste el correo o el código expiró?</p>
                <form th:action="@{/reenviar-codigo}" method="post" class="d-inline">
                    <input type="hidden" name="email" th:value="${email}">
                    <button type="submit" class="btn btn-link text-cf-accent small fw-bold text-decoration-none p-0">
                        <i class="bi bi-arrow-clockwise me-1"></i> Reenviar nuevo código
                    </button>
                </form>
            </div>

            <div class="mt-3">
                <a th:href="@{/login}" class="text-muted small text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Volver al inicio de sesión
                </a>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>

</body>
</html>
