<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('CampusFood - Verificar Código')}"></head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5 text-center">
                    
                    <!-- Icono Ilustrativo -->
                    <div class="mb-3 d-inline-flex align-items-center justify-content-center rounded-circle bg-light text-primary" style="width: 72px; height: 72px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" class="bi bi-shield-check text-brand" viewBox="0 0 16 16">
                            <path d="M5.338 1.59a61.44 61.44 0 0 0-2.837.856.481.481 0 0 0-.328.39c-.554 4.157.726 7.19 2.253 9.188a10.725 10.725 0 0 0 2.287 2.233c.346.244.652.42.893.533.12.057.218.095.293.118a.55.55 0 0 0 .101.025.615.615 0 0 0 .1-.025c.076-.023.174-.061.294-.118.24-.113.547-.29.893-.533a10.726 10.726 0 0 0 2.287-2.233c1.527-1.997 2.807-5.031 2.253-9.188a.48.48 0 0 0-.328-.39c-.651-.213-1.75-.56-2.837-.855C9.552 1.29 8.531 1.067 8 1.067c-.53 0-1.552.223-2.662.524zM5.072.56C6.157.265 7.31 0 8 0s1.843.265 2.928.56c1.11.3 2.229.655 2.887.87a1.54 1.54 0 0 1 1.044 1.262c.596 4.477-.787 7.795-2.465 9.99a11.775 11.775 0 0 1-2.517 2.453 7.159 7.159 0 0 1-1.048.625c-.28.132-.581.24-.829.24s-.548-.108-.829-.24a7.158 7.158 0 0 1-1.048-.625 11.777 11.777 0 0 1-2.517-2.453C1.928 10.487.545 7.169 1.141 2.692A1.54 1.54 0 0 1 2.185 1.43 62.456 62.456 0 0 1 5.072.56z"/>
                            <path d="M10.854 5.146a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7.5 7.793l2.646-2.647a.5.5 0 0 1 .708 0z"/>
                        </svg>
                    </div>

                    <h3 class="fw-bold mb-2">Valida tu Correo</h3>
                    <p class="text-muted small mb-4">
                        Hemos enviado un código numérico de 6 dígitos a:<br>
                        <strong class="text-dark" th:text="${email != null ? email : 'tu correo institucional'}">usuario@utp.edu.pe</strong>
                    </p>

                    <!-- Alertas -->
                    <div th:if="${mensajeExito}" class="alert alert-success py-2 small" th:text="${mensajeExito}"></div>
                    <div th:if="${errorVerificacion}" class="alert alert-danger py-2 small" th:text="${errorVerificacion}"></div>

                    <!-- Formulario de Validación de Código -->
                    <form th:action="@{/verificar-codigo}" method="post" class="mt-4">
                        <input type="hidden" name="email" th:value="${email}">

                        <div class="mb-3 text-start">
                            <label for="codigoInput" class="form-label text-center d-block fw-semibold text-secondary">
                                Ingresa el código de 6 dígitos
                            </label>
                            <input type="text"
                                   id="codigoInput"
                                   name="codigo"
                                   class="form-control form-control-lg text-center fw-bold"
                                   style="font-size: 2rem; letter-spacing: 12px; font-family: monospace;"
                                   maxlength="6"
                                   pattern="[0-9]{6}"
                                   inputmode="numeric"
                                   placeholder="000000"
                                   required
                                   autofocus>
                            <div class="form-text text-center text-muted small mt-2">
                                ⏱️ El código vence en 15 minutos.
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-brand btn-lg fw-semibold">
                                Validar y Activar Cuenta
                            </button>
                        </div>
                    </form>

                    <!-- Reenviar código -->
                    <div class="mt-4 pt-3 border-top">
                        <p class="small text-muted mb-2">¿No recibiste el correo o el código expiró?</p>
                        <form th:action="@{/reenviar-codigo}" method="post" class="d-inline">
                            <input type="hidden" name="email" th:value="${email}">
                            <button type="submit" class="btn btn-link btn-sm text-decoration-none fw-semibold p-0">
                                🔄 Reenviar nuevo código
                            </button>
                        </form>
                    </div>

                    <div class="mt-3">
                        <a th:href="@{/login}" class="text-muted small text-decoration-none">
                            ← Volver al inicio de sesión
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>

</body>
</html>
