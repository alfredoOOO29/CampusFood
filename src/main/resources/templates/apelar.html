<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Apelar Suspensión - CampusFood')}"></head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container my-5 d-flex justify-content-center">
    <div class="cf-card p-4 p-md-5" style="max-width: 620px; width: 100%;">
        <div class="text-center mb-4">
            <div class="cf-feature-icon mx-auto mb-3" style="width: 68px; height: 68px; font-size: 1.8rem;">
                <i class="bi bi-shield-shaded text-cf-primary"></i>
            </div>
            <h2 class="fw-bold text-dark mb-2">Centro de Apelaciones</h2>
            <p class="text-muted small">Si tu cuenta fue suspendida por un reporte que consideras injusto o por strikes, puedes enviar tu descargo aquí.</p>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-4" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show rounded-4" role="alert">
            <span th:text="${mensajeExito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <form th:action="@{/apelar}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label small fw-semibold text-secondary">Correo Institucional</label>
                <div class="cf-input-group">
                    <i class="bi bi-envelope cf-input-icon"></i>
                    <input type="email" name="email" id="email" class="form-control" placeholder="ej. usuario@utp.edu.pe" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label for="motivoApelacion" class="form-label small fw-semibold text-secondary">Descargo y Enlace de Evidencias</label>
                <textarea name="motivoApelacion" id="motivoApelacion" class="form-control rounded-4" rows="4" placeholder="Explica lo sucedido o adjunta un enlace (Google Drive) con capturas de WhatsApp para revisión del administrador..." required></textarea>
            </div>
            
            <button type="submit" class="btn btn-cf-primary w-100 py-3 fw-bold fs-6">
                <span>Enviar Apelación</span>
                <i class="bi bi-send-fill"></i>
            </button>
        </form>
    </div>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>

</body>
</html>
