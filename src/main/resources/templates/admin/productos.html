<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Gestión de Productos - CampusFood')}"></head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container my-4 my-md-5">
    
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4 pb-2 border-bottom">
        <div>
            <h2 class="fw-bold mb-1">Gestión de Publicaciones</h2>
            <p class="text-muted small mb-0">Modera y supervisa los alimentos publicados en el campus.</p>
        </div>
        <a th:href="@{/admin}" class="btn btn-cf-secondary py-2 px-3 small fw-semibold">
            <i class="bi bi-arrow-left me-1"></i> Volver al Panel Admin
        </a>
    </div>

    <!-- Alertas -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show rounded-4 shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="cf-card overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4 py-3 small text-muted text-uppercase fw-bold">ID</th>
                        <th class="py-3 small text-muted text-uppercase fw-bold">Alimento</th>
                        <th class="py-3 small text-muted text-uppercase fw-bold">Categoría</th>
                        <th class="py-3 small text-muted text-uppercase fw-bold">Vendedor</th>
                        <th class="py-3 small text-muted text-uppercase fw-bold">Precio / Stock</th>
                        <th class="py-3 small text-muted text-uppercase fw-bold">Estado</th>
                        <th class="pe-4 py-3 small text-muted text-uppercase fw-bold text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="producto : ${productos}">
                        <td class="ps-4 text-muted fw-bold" th:text="'#' + ${producto.id}">#1</td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <img th:if="${producto.imagenUrl != null and !producto.imagenUrl.isEmpty()}" 
                                     th:src="@{${producto.imagenUrl}}" 
                                     class="rounded-3" 
                                     style="width: 40px; height: 40px; object-fit: cover;">
                                <span class="fw-bold text-dark" th:text="${producto.nombre}">Hamburguesa Clásica</span>
                            </div>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border rounded-pill" th:text="${producto.categoria.nombre}">Cat</span>
                        </td>
                        <td class="small" th:text="${producto.vendedor.nombre + ' ' + producto.vendedor.apellidos}">Vendedor</td>
                        <td>
                            <div class="d-flex flex-column">
                                <span class="fw-bold text-cf-accent" th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1, 2)}">S/ 8.00</span>
                                <small class="text-muted" th:text="'Stock: ' + ${producto.stock}">Stock: 0</small>
                            </div>
                        </td>
                        <td>
                            <span class="badge rounded-pill px-3 py-1 fw-bold" 
                                  th:classappend="${producto.activo ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-danger-subtle text-danger border border-danger-subtle'}" 
                                  th:text="${producto.activo ? 'PUBLICADO' : 'SUSPENDIDO'}">PUBLICADO</span>
                        </td>
                        <td class="pe-4 text-center">
                            <form th:action="@{/admin/productos/{id}/toggle-estado(id=${producto.id})}" method="post">
                                <button type="submit" class="btn btn-sm rounded-pill px-3 fw-bold" 
                                        th:classappend="${producto.activo ? 'btn-outline-danger' : 'btn-cf-primary'}" 
                                        th:text="${producto.activo ? 'Suspender' : 'Activar'}">
                                    Suspender
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>

</body>
</html>
