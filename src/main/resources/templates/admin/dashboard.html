<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Panel de Administración - CampusFood')}"></head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container my-4 my-md-5">
    <div class="row g-4">
        <!-- Sidebar de Admin -->
        <aside class="col-lg-3">
            <div class="cf-card p-3">
                <h5 class="fw-bold text-cf-primary mb-3 px-2">
                    <i class="bi bi-shield-lock-fill me-1 text-danger"></i> Administración
                </h5>
                <ul class="nav flex-column gap-1">
                    <li class="nav-item">
                        <a class="nav-link active bg-cf-primary text-white rounded-pill px-3 py-2 fw-bold shadow-sm" th:href="@{/admin}">
                            <i class="bi bi-speedometer2 me-2"></i> Panel Principal
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark rounded-pill px-3 py-2 fw-medium" th:href="@{/admin/usuarios}">
                            <i class="bi bi-people me-2 text-primary"></i> Usuarios
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark rounded-pill px-3 py-2 fw-medium" th:href="@{/admin/productos}">
                            <i class="bi bi-egg-fried me-2 text-success"></i> Productos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark rounded-pill px-3 py-2 fw-medium" th:href="@{/admin/reclamos}">
                            <i class="bi bi-exclamation-octagon me-2 text-danger"></i> Reclamos y Strikes
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1 text-dark">Panel de Control</h2>
                    <p class="text-muted small mb-0">Resumen y métricas globales de la plataforma CampusFood.</p>
                </div>
            </div>
            
            <!-- Cards de Métricas -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="cf-kpi-card">
                        <div class="cf-kpi-icon blue">
                            <i class="bi bi-people-fill"></i>
                        </div>
                        <div>
                            <div class="cf-kpi-label">Usuarios Totales</div>
                            <div class="cf-kpi-value" th:text="${totalUsuarios}">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="cf-kpi-card">
                        <div class="cf-kpi-icon green">
                            <i class="bi bi-shop"></i>
                        </div>
                        <div>
                            <div class="cf-kpi-label">Alimentos Activos</div>
                            <div class="cf-kpi-value" th:text="${totalProductos}">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="cf-kpi-card">
                        <div class="cf-kpi-icon amber">
                            <i class="bi bi-bag-check-fill"></i>
                        </div>
                        <div>
                            <div class="cf-kpi-label">Pedidos Generados</div>
                            <div class="cf-kpi-value" th:text="${totalPedidos}">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Gráfico de Actividad -->
            <div class="cf-card p-4 p-md-5 mb-4">
                <h5 class="fw-bold mb-4 text-dark">Actividad de la Plataforma</h5>
                <div style="position: relative; height:32vh; width:100%">
                    <canvas id="statsChart"></canvas>
                </div>
            </div>
            
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener("DOMContentLoaded", function() {
        const ctx = document.getElementById('statsChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Usuarios Registrados', 'Productos Publicados', 'Pedidos Generados'],
                datasets: [{
                    label: 'Métricas Actuales',
                    data: [
                        /*[[${totalUsuarios}]]*/ 0,
                        /*[[${totalProductos}]]*/ 0,
                        /*[[${totalPedidos}]]*/ 0
                    ],
                    backgroundColor: [
                        'rgba(15, 62, 46, 0.85)',
                        'rgba(22, 163, 74, 0.85)',
                        'rgba(245, 158, 11, 0.85)'
                    ],
                    borderRadius: 10,
                    borderSkipped: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { borderDash: [4, 4], color: '#e5e9e5' },
                        ticks: { stepSize: 1, font: { family: 'Plus Jakarta Sans' } }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { font: { family: 'Plus Jakarta Sans', weight: '600' } }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    });
    /*]]>*/
</script>

<footer th:replace="~{layout/base :: footer}"></footer>

</body>
</html>
